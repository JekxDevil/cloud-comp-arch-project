# OpenEvolve config for Part 3.2 -- evolving a co-scheduling policy.
#
# Run from the repo root:
#   export OPENAI_API_KEY=sk-rc-...
#   openevolve-run --config openevolve/config.yaml \
#                  -o openevolve_runs/run_$(date +%Y%m%d_%H%M%S) \
#                  openevolve/initial_program.py \
#                  openevolve/evaluator.py

max_iterations: 80              # cheap simulator => can afford a real search
checkpoint_interval: 1          # MUST stay at 1 (course requirement)

llm:
  api_base: "https://api.swissai.cscs.ch/v1"
  # Back to Llama-3.3-70B (Qwen3-Coder is listed but returns 503 -- no
  # provider). Keep temp 1.0 + non-diff mode to get genuine exploration
  # this time. If still no diversity, switch to
  # deepseek-ai/DeepSeek-R1-Distill-Llama-70B (reasoning-tuned).
  primary_model: "meta-llama/Llama-3.3-70B-Instruct"
  temperature: 1.0
  top_p: 0.95
  max_tokens: 4096
  timeout: 120

prompt:
  template_dir: "prompts"       # resolved relative to THIS config file
  system_message: "system"      # => openevolve/prompts/system.md

database:
  population_size: 200          # MUST stay at 200 (course requirement)
  num_islands: 4                # parallel sub-populations help diversity
  elite_selection_ratio: 0.1
  exploitation_ratio: 0.6       # 60% mutate elites, 40% explore
  # MAP-Elites cells: rewards filling the (score, structural_diversity) grid.
  # Without dag_edit_distance the LLM kept producing baseline-equivalent
  # plans; this forces the database to keep structurally-different ones too.
  feature_dimensions:
    - "combined_score"
    - "dag_edit_distance"
  feature_bins:
    combined_score: 10
    dag_edit_distance: 8        # 0..7 jobs can differ from baseline

evaluator:
  cascade_evaluation: false
  parallel_evaluations: 1       # simulator is fast; serial is fine
  timeout: 30                   # any single eval >30s is a bug

diff_based_evolution: false     # full block rewrites: gives the LLM room to restructure,
                                # not just patch. Diff mode kept producing no-op edits.
max_code_length: 50000
