# OpenEvolve config for Part 3.2
#
# Run from the repo root:
#   export OPENAI_API_KEY=sk-
#   openevolve-run --config openevolve/config.yaml -o openevolve_runs/run_$(date +%Y%m%d_%H%M%S) openevolve/initial_program.py openevolve/evaluator.py

max_iterations: 80              
checkpoint_interval: 1          
llm:
  api_base: "https://api.swissai.cscs.ch/v1"
  #primary_model: "meta-llama/Llama-3.3-70B-Instruct"
  primary_model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
  temperature: 1.0
  top_p: 0.95
  max_tokens: 4096
  timeout: 120

prompt:
  template_dir: "prompts"       
  system_message: "system"      

database:
  population_size: 200         
  num_islands: 4                
  elite_selection_ratio: 0.1
  exploitation_ratio: 0.6       
  feature_dimensions:
    - "combined_score"
    - "dag_edit_distance"
  feature_bins:
    combined_score: 10
    dag_edit_distance: 8        

evaluator:
  cascade_evaluation: false
  parallel_evaluations: 1       
  timeout: 30                   

diff_based_evolution: false     
max_code_length: 50000
