# OpenEvolve config for Part 3.2 -- evolving a co-scheduling policy.
#
# Run from the repo root:
#   export OPENAI_API_KEY=sk-rc-...
#   openevolve-run --config openevolve/config.yaml \
#                  -o openevolve_runs/run_$(date +%Y%m%d_%H%M%S) \
#                  openevolve/initial_program.py \
#                  openevolve/evaluator.py

max_iterations: 80              # cheap simulator => can afford a real search
checkpoint_interval: 1          # MUST stay at 1 (course requirement)

llm:
  api_base: "https://api.swissai.cscs.ch/v1"
  # Swiss AI Platform models: meta-llama/Llama-3.3-70B-Instruct,
  # Qwen/Qwen2.5-Coder-32B-Instruct, deepseek-ai/DeepSeek-V3, etc.
  # Llama 3.3 70B is a solid default for code-edit diffs.
  primary_model: "meta-llama/Llama-3.3-70B-Instruct"
  temperature: 0.7              # some exploration, not chaotic
  top_p: 0.9
  max_tokens: 4096
  timeout: 120

prompt:
  template_dir: "openevolve/prompts"
  system_message: "system"      # => openevolve/prompts/system.md

database:
  population_size: 200          # MUST stay at 200 (course requirement)
  num_islands: 4                # parallel sub-populations help diversity
  elite_selection_ratio: 0.1
  exploitation_ratio: 0.6       # 60% mutate elites, 40% explore

evaluator:
  cascade_evaluation: false
  parallel_evaluations: 1       # simulator is fast; serial is fine
  timeout: 30                   # any single eval >30s is a bug

diff_based_evolution: true      # smaller, focused edits per iteration
max_code_length: 50000
